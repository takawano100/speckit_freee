<div class="lead">
  <span class="h">目標が2つ、先に決まっていた</span>
  カスタマイズは一切しない。<br>紙を使った業務を一切なくす。<br><br>
  そう決めた時点で、<b>システムは標準のまま</b>になり、<b>データは5テーブル</b>になり、
  <b>関わる人の役割も単純</b>になった。
</div>

<div class="cond">
  <b>ただし、これは条件つきだった。</b><br>
  担当役員も、人事担当も、給与担当も、元SEだった。<br>
  使う側にそれがなければ、標準のままでは回らなかった。
</div>

<div class="foot">
