<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>所属長の残業時間管理</title>
<style>
  :root {
    --ink:#183850; --ink-soft:#47677f; --line:#cedce6; --surface:#fff; --canvas:#eef4f7;
    --safe:#2f765b; --safe-pale:#e8f5ef; --caution:#a9640f; --caution-pale:#fbf0df;
    --warn:#a33d3d; --warn-pale:#fff0f0; --none:#6d7887; --none-pale:#eef1f5;
    font-family:"Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px clamp(16px,3vw,40px) 40px; background:var(--canvas); color:var(--ink); font-size:15px; line-height:1.7; }
  .wrap { max-width:1100px; margin:0 auto; }
  .kicker { margin:0 0 4px; font-size:.7rem; font-weight:800; letter-spacing:.15em; color:#a94f0b; }
  h1 { margin:0; font-size:clamp(1.3rem,2.4vw,1.8rem); }
  .lead { margin:6px 0 0; color:var(--ink-soft); font-size:.9rem; }
  .stale { margin:14px 0 0; padding:12px 16px; background:var(--warn-pale); border:2px solid var(--warn); border-radius:10px; color:var(--warn); font-weight:800; }
  .stale small { display:block; font-weight:400; color:var(--ink-soft); }
  .meta { margin:14px 0 0; display:flex; flex-wrap:wrap; gap:8px 18px; font-size:.82rem; color:var(--ink-soft); }
  .meta b { color:var(--ink); }
  .meta .th { padding:2px 10px; border:1px solid var(--line); border-radius:999px; background:var(--surface); }
  .modes { margin-top:16px; display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; width:max-content; }
  .mode { padding:8px 18px; border:0; background:var(--surface); color:var(--ink-soft); font:inherit; font-size:.88rem; font-weight:700; cursor:pointer; }
  .mode + .mode { border-left:1px solid var(--line); }
  .mode[aria-selected="true"] { background:#1f5d86; color:#fff; }
  .deps { margin-top:16px; display:flex; flex-wrap:wrap; gap:6px; }
  .dep { padding:6px 14px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink-soft); font:inherit; font-size:.85rem; font-weight:700; cursor:pointer; }
  .dep[aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
  .dep .cnt { margin-left:6px; font-size:.72rem; font-weight:400; opacity:.8; }
  .cards { margin-top:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .card { padding:14px 16px 12px; background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--none); border-radius:12px; }
  .card.safe { border-top-color:var(--safe); } .card.caution { border-top-color:var(--caution); } .card.warn { border-top-color:var(--warn); }
  .card .who { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .card .who b { font-size:1.05rem; }
  .card .who small { color:var(--ink-soft); font-size:.75rem; }
  .st { display:inline-block; margin-top:6px; padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:800; }
  .st.safe { background:var(--safe-pale); color:var(--safe); } .st.caution { background:var(--caution-pale); color:var(--caution); }
  .st.warn { background:var(--warn-pale); color:var(--warn); } .st.none { background:var(--none-pale); color:var(--none); }
  .big { margin-top:8px; display:flex; align-items:baseline; gap:6px; }
  .big b { font-size:1.9rem; font-variant-numeric:tabular-nums; }
  .big span { color:var(--ink-soft); font-size:.8rem; }
  .bar { margin-top:6px; height:8px; border-radius:4px; background:var(--none-pale); overflow:hidden; position:relative; }
  .bar i { display:block; height:100%; background:var(--safe); }
  .card.caution .bar i { background:var(--caution); } .card.warn .bar i { background:var(--warn); }
  .bar em { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); opacity:.35; }
  .kv { margin:8px 0 0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:.82rem; }
  .kv span { color:var(--ink-soft); }
  .kv b { font-variant-numeric:tabular-nums; }
  .kv b.hot { color:var(--warn); }
  .kv small { color:var(--ink-soft); font-weight:400; }
  .tablewrap { margin-top:22px; overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
  table { width:100%; border-collapse:collapse; font-size:.84rem; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; text-align:left; }
  th { background:#f5f9fc; font-size:.74rem; color:var(--ink-soft); }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  td.d { text-align:center; font-variant-numeric:tabular-nums; }
  td.d.x { color:var(--none); background:var(--none-pale); }
  td.d.hot { background:var(--caution-pale); font-weight:700; }
  td.d.miss { color:var(--warn); background:var(--warn-pale); }
  tr:last-child td { border-bottom:none; }
  .sum { margin-top:14px; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .sum div { padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--none); border-radius:10px; }
  .sum div b { display:block; font-size:1.6rem; font-variant-numeric:tabular-nums; }
  .sum div span { font-size:.78rem; color:var(--ink-soft); }
  .sum .warn { border-left-color:var(--warn); } .sum .caution { border-left-color:var(--caution); } .sum .safe { border-left-color:var(--safe); }
  .filters { margin-top:12px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:.84rem; }
  .filters label { display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
  .filters select { font:inherit; font-size:.84rem; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); }
  .filters .n { margin-left:auto; color:var(--ink-soft); font-size:.78rem; }
  .depstrip { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; }
  .depstrip span { padding:3px 10px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:.76rem; color:var(--ink-soft); }
  .depstrip span.hot { border-color:var(--warn); color:var(--warn); font-weight:700; }
  .depstrip span.mid { border-color:var(--caution); color:var(--caution); font-weight:700; }
  .depstrip span.nohead { border-style:dashed; }
  table.all td { white-space:normal; }
  table.all tr.warn td:first-child { box-shadow:inset 4px 0 0 var(--warn); }
  table.all tr.caution td:first-child { box-shadow:inset 4px 0 0 var(--caution); }
  table.all tr.none td { color:var(--ink-soft); }
  .tag { display:inline-block; padding:1px 7px; border-radius:4px; font-size:.7rem; background:var(--none-pale); color:var(--none); }
  .tag.head { background:#e7edf7; color:#2c4a7c; }
  .tag.sub { background:var(--caution-pale); color:var(--caution); }
  .foot { margin-top:16px; font-size:.78rem; color:var(--ink-soft); }
  .foot code { font-family:Consolas,monospace; font-size:.74rem; }
  .fail { margin-top:16px; padding:14px 16px; background:var(--warn-pale); border:2px solid var(--warn); border-radius:10px; color:var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">SABUROKU MONITOR — 001-saburoku-monitor</p>
  <h1 id="title">所属長の残業時間管理</h1>
  <p class="lead">freee人事労務の日次勤怠を読んで、部下ごとの今月の時間外を「残り」と「超える予定日」に直す。月間の上限だけを見る。通知はしない（画面だけ）。</p>
  <div id="stale" class="stale" hidden></div>
  <div id="fail" class="fail" hidden></div>
  <div class="modes" role="tablist">
    <button type="button" role="tab" class="mode" id="mode-dep" aria-selected="true">所属長として見る</button>
    <button type="button" role="tab" class="mode" id="mode-all" aria-selected="false">全社を見る（労務担当）</button>
  </div>
  <div class="meta" id="meta"></div>
  <div id="view-dep">
    <div class="deps" id="deps" role="tablist"></div>
    <div class="cards" id="cards"></div>
    <div class="tablewrap"><table id="days"></table></div>
  </div>
  <div id="view-all" hidden>
    <div class="sum" id="sum"></div>
    <div class="filters" id="filters"></div>
    <div class="depstrip" id="depstrip"></div>
    <div class="tablewrap"><table id="all" class="all"></table></div>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script src="saburoku_calc.js"></script>
<script>
/* 画面は描画だけ。計算は saburoku_calc.js（純関数）。契約は specs/001-saburoku-monitor/contracts/page-url.md */
(async () => {
  const S = window.Saburoku;
  const q = new URLSearchParams(location.search);
  const dataPath = q.get('data') || './data/saburoku_2026-09.json';
  const $ = id => document.getElementById(id);
  const label = { safe: '安全', caution: '注意', warn: '警告', none: '打刻なし' };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ── 読めない朝（K024・T25）：一覧の枠を出し「取得できず」 ── */
  let D;
  try {
    const res = await fetch(dataPath + (dataPath.includes('?') ? '&' : '?') + 'v=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    D = await res.json();
  } catch (err) {
    $('title').textContent = '所属長の残業時間管理 — 今朝の数字を読めていません';
    $('fail').hidden = false;
    $('fail').innerHTML = `<b>数字を読めていません。</b>この画面の数字は無効です。空白は「残業なし」ではありません。<br><small>読もうとしたもの：<code>${esc(dataPath)}</code>／理由：${esc(err.message)}</small>`;
    $('cards').innerHTML = `<div class="card none"><div class="who"><b>取得できず</b></div><span class="st none">取得できず</span><div class="big"><b>—</b><span>今月の時間外</span></div></div>`;
    $('days').innerHTML = '<tr><th>氏名</th><th>状態</th></tr><tr><td>全員</td><td class="d miss">取得できず</td></tr>';
    $('meta').innerHTML = `<span>対象月 <b>—</b></span><span>時点 <b>—</b></span>`;
    document.querySelectorAll('.mode, .deps').forEach(el => el.setAttribute('disabled', ''));
    return;
  }

  const today = q.get('today') || D.as_of;                 // research R-1：端末の時計は使わない
  const monthFirst = D.month + '-01';
  const th = S.pickThreshold(D.threshold_history, D.thresholds, monthFirst);
  const cal = D.calendar;
  const bd = S.businessDays(cal);
  const past = bd.filter(d => d < today), future = bd.filter(d => d >= today);

  /* ── 鮮度（K023・T25・T31）── */
  const fr = S.freshness ? safe(() => S.freshness(D, today)) : null;
  function safe(fn) { try { return fn(); } catch (e) { return null; } }
  if (fr && fr.undeterminable) {
    $('stale').hidden = false;
    $('stale').innerHTML = `前営業日を判定できません（カレンダーが前月を含んでいません）。<small>数字は ${esc(fmtDT(D.fetched_at))} 取得・打刻は ${fr.lastPunchDate ? S.md(fr.lastPunchDate) : '—'} まで。今日 ${S.md(today)}。</small>`;
  } else if (fr && fr.stale) {
    $('stale').hidden = false;
    $('stale').innerHTML = `前回 ${esc(fmtDT(D.fetched_at))} の数字です（${S.md(fr.lastPunchDate)} の打刻まで）。<small>前営業日 ${S.md(fr.prevBusinessDay)}（${S.weekday(fr.prevBusinessDay)}）の打刻を含んでいません。今日 ${S.md(today)}（${S.weekday(today)}）の朝の数字としては古い。</small>`;
  }
  function fmtDT(iso) { return iso ? iso.replace('T', ' ').slice(0, 16).replace(/-/g, '/') : '—'; }

  /* ── 共通のメタ（K013・T30）── */
  const nextTh = th.next ? `・次回 ${th.next.effective_from.replace(/-/g, '/')}〜 ${S.hm(th.next.warning_mins)}／${S.hm(th.next.caution_mins)}` : '';
  $('meta').innerHTML =
    `<span>対象月 <b>${+D.month.slice(0, 4)}年${+D.month.slice(5, 7)}月</b>（勤務月）</span>` +
    `<span>時点 <b>${S.md(today)}（${S.weekday(today)}）</b>・打刻は ${past.length ? S.md(past[past.length - 1]) : '—'} まで</span>` +
    `<span>経過 <b>${past.length}</b> ／ 残り <b>${future.length}</b> 営業日</span>` +
    `<span class="th">閾値 警告 <b>${S.hm(th.warning_mins)}</b>／注意 <b>${S.hm(th.caution_mins)}</b>（${th.effective_from ? th.effective_from.replace(/-/g, '/') + '〜' : '既定'}）${esc(nextTh)}</span>`;

  /* ── 1人ぶんのカード（K012・K016）── */
  const card = r => {
    const pct = Math.min(100, r.ot / th.warning_mins * 100);
    const hit = r.ot >= th.warning_mins ? '到達済み'
      : r.hitDate ? `${S.md(r.hitDate)}（${S.weekday(r.hitDate)}）${r.paceIsRough ? ' <small>まだ目安</small>' : ''}`
      : r.punched.length ? '月内は超えない見込み' : '—';
    return `<div class="card ${r.status}">
      <div class="who"><b>${esc(r.m.name)}</b><small>${esc(r.m.num)}${r.m.position ? ' ・ ' + esc(r.m.position) : ''}${r.m.self ? ' ・ 自分' : ''}</small></div>
      <span class="st ${r.status}">${label[r.status]}</span>
      <div class="big"><b>${S.hm(r.ot)}</b><span>今月の時間外</span></div>
      <div class="bar"><i style="width:${pct}%"></i><em style="left:${th.caution_mins / th.warning_mins * 100}%"></em></div>
      <div class="kv">
        <span>残り（${S.hm(th.warning_mins)} まで）</span><b class="${r.remain <= 0 ? 'hot' : ''}">${r.punched.length || r.holidayWork.length ? (r.remain > 0 ? S.hm(r.remain) : '超過 ' + S.hm(-r.remain)) : '—'}</b>
        <span>1日あたり</span><b>${r.punched.length ? S.hm(r.pace) : '—'}</b>
        <span>超える予定日</span><b class="${r.hitDate || r.ot >= th.warning_mins ? 'hot' : ''}">${hit}</b>
        <span>月末の見込み</span><b>${r.punched.length ? S.hm(r.forecast) : '—'}</b>
        <span>打刻なし</span><b class="${r.missing.length ? 'hot' : ''}">${r.missing.length} 日 / ${past.length} 日${r.halfClock.length ? '（退勤なし ' + r.halfClock.length + '）' : ''}</b>
        ${r.absent.length ? `<span>欠勤</span><b>${r.absent.length} 日</b>` : ''}
        ${r.holidayWork.length ? `<span>休日出勤</span><b class="hot">${r.holidayWork.length} 日（${S.hm(r.otHoliday)} を合計に含む）</b>` : ''}
      </div>
    </div>`;
  };

  /* ── 日別の表（K017）── */
  const dayTable = rows => {
    const extra = [...new Set(rows.flatMap(r => r.holidayWork))];
    const cols = [...new Set([...past, ...extra])].sort();
    const th_ = '<tr><th>氏名</th>' + cols.map(d => `<th style="text-align:center${cal[d] !== 'normal_day' ? ';color:var(--warn)' : ''}">${S.md(d)}<br><small>${S.weekday(d)}${cal[d] !== 'normal_day' ? '・休' : ''}</small></th>`).join('') + '<th style="text-align:right">合計</th></tr>';
    const tr = rows.map(r => '<tr><td><b>' + esc(r.m.name) + '</b></td>' + cols.map(d => {
      const x = r.rec[d];
      if (cal[d] !== 'normal_day') return x && x.clock_in ? `<td class="d hot" title="${x.clock_in}〜${x.clock_out} 休日出勤">${S.hm(x.overtime_mins)}</td>` : '<td class="d x">—</td>';
      if (x && x.is_absence) return '<td class="d x" title="欠勤">欠</td>';
      if (x && x.time_clock_only && !x.clock_in) return '<td class="d miss" title="出勤打刻のみ。退勤打刻が無い">退勤なし</td>';
      if (!x || !x.clock_in) return '<td class="d miss">未</td>';
      const cls = x.overtime_mins >= 180 ? 'hot' : x.overtime_mins === 0 ? 'x' : '';
      return `<td class="d ${cls}" title="${x.clock_in}〜${x.clock_out}">${S.hm(x.overtime_mins)}</td>`;
    }).join('') + `<td class="n"><b>${S.hm(r.ot)}</b></td></tr>`).join('');
    return th_ + tr;
  };

  /* ── 所属長ビュー（K012）── */
  const calcDept = dep => S.sortMembers(dep.members.map(m => S.personMonth(m, cal, today, th)));
  const renderDept = dep => {
    const rows = calcDept(dep);
    $('title').textContent = `${dep.group.name} ・ 所属長 ${dep.manager.name}（${dep.manager.position}）の残業時間管理`;
    $('cards').innerHTML = rows.map(card).join('');
    $('days').innerHTML = dayTable(rows);
  };
  const deps = $('deps');
  deps.innerHTML = D.departments.map((dep, i) => {
    const n = calcDept(dep).filter(r => r.status === 'warn' || r.status === 'caution').length;
    return `<button type="button" class="dep" role="tab" aria-selected="${i === 0}" data-i="${i}">${esc(dep.group.name)} ・ ${esc(dep.manager.name)}<span class="cnt">${dep.members.length}人${n ? ' ・ 要対応 ' + n : ''}</span></button>`;
  }).join('');
  const selectDep = i => {
    deps.querySelectorAll('.dep').forEach(o => o.setAttribute('aria-selected', String(+o.dataset.i === i)));
    renderDept(D.departments[i]);
    history.replaceState(null, '', location.pathname + location.search + '#dep=' + i);
  };
  deps.querySelectorAll('.dep').forEach(b => b.addEventListener('click', () => selectDep(+b.dataset.i)));

  /* ── 全社ビュー（K019・K020）── */
  const C = D.company;
  const heads = Object.fromEntries(C.members.filter(m => m.is_head).map(m => [m.dept, m]));
  const allRows = C.members.map(m => Object.assign(S.personMonth(m, cal, today, th), { head: heads[m.dept] || null }));
  const state = { st: new Set(['warn', 'caution', 'safe', 'none']), dept: '' };
  const countBy = rows => Object.fromEntries(['warn', 'caution', 'safe', 'none'].map(k => [k, rows.filter(r => r.status === k).length]));
  const renderAll = () => {
    const c = countBy(allRows);
    $('title').textContent = '全社の残業時間管理（労務担当）';
    $('sum').innerHTML =
      `<div class="warn"><b>${c.warn}</b><span>警告（${S.hm(th.warning_mins)} 以上）</span></div>` +
      `<div class="caution"><b>${c.caution}</b><span>注意（${S.hm(th.caution_mins)} 以上）</span></div>` +
      `<div class="safe"><b>${c.safe}</b><span>安全（打刻あり・${S.hm(th.caution_mins)} 未満）</span></div>` +
      `<div><b>${c.none}</b><span>打刻なし（今月の打刻がゼロ）</span></div>`;
    $('depstrip').innerHTML = C.departments.map(d => {
      const k = countBy(allRows.filter(r => r.m.dept === d.code));
      const cls = k.warn ? 'hot' : k.caution ? 'mid' : ''; const nohead = heads[d.code] ? '' : ' nohead';
      return `<span class="${cls}${nohead}" title="${esc(d.hq)}">${esc(d.name)}${heads[d.code] ? '' : '（所属長なし）'} ${k.warn ? '警告' + k.warn + ' ' : ''}${k.caution ? '注意' + k.caution + ' ' : ''}${k.none ? '未' + k.none : ''}</span>`;
    }).join('');
    const f = $('filters');
    if (!f.dataset.ready) {
      f.innerHTML = [['warn', '警告'], ['caution', '注意'], ['safe', '安全'], ['none', '打刻なし']].map(([k, l]) => `<label><input type="checkbox" data-st="${k}" checked> ${l}</label>`).join('') +
        `<select id="f-dept"><option value="">すべての部門</option>${C.departments.map(d => `<option value="${d.code}">${esc(d.hq)} ／ ${esc(d.name)}</option>`).join('')}</select><span class="n" id="f-n"></span>`;
      f.querySelectorAll('input[data-st]').forEach(i => i.addEventListener('change', () => { i.checked ? state.st.add(i.dataset.st) : state.st.delete(i.dataset.st); renderAll(); }));
      f.querySelector('#f-dept').addEventListener('change', e => { state.dept = e.target.value; renderAll(); });
      f.dataset.ready = '1';
    }
    const rows = S.sortMembers(allRows.filter(r => state.st.has(r.status) && (!state.dept || r.m.dept === state.dept)));
    $('f-n').textContent = `${rows.length} / ${allRows.length} 人（役員 ${C.excluded.length} 人は対象外）`;
    $('all').innerHTML = '<tr><th>状態</th><th>本部</th><th>部門</th><th>所属長</th><th>氏名</th><th>役職</th><th style="text-align:right">今月の時間外</th><th style="text-align:right">残り</th><th>超える予定日</th><th style="text-align:right">打刻なし</th><th>データ</th></tr>' +
      rows.map(r => `<tr class="${r.status}">
        <td><span class="st ${r.status}" style="margin:0">${label[r.status]}</span></td>
        <td>${esc(r.m.hq || '')}</td><td>${esc(r.m.dept_name)}</td>
        <td>${r.head ? (r.head.employee_id === r.m.employee_id ? '<span class="tag head">自分（部長）</span>' : esc(r.head.name)) : '<span class="tag">所属長なし</span>'}</td>
        <td><b>${esc(r.m.name)}</b>${r.m.sub && r.m.sub.length ? ' <span class="tag sub" title="' + esc(r.m.sub.join('、')) + '">兼務</span>' : ''}</td>
        <td>${esc(r.m.position || '—')}</td>
        <td class="n">${r.punched.length || r.holidayWork.length ? S.hm(r.ot) : '—'}</td>
        <td class="n">${r.punched.length || r.holidayWork.length ? (r.remain > 0 ? S.hm(r.remain) : '超過 ' + S.hm(-r.remain)) : '—'}</td>
        <td>${r.ot >= th.warning_mins ? '到達済み' : r.hitDate ? S.md(r.hitDate) + '（' + S.weekday(r.hitDate) + '）' : r.punched.length ? '月内は超えない見込み' : '—'}</td>
        <td class="n">${r.missing.length} / ${past.length}</td>
        <td><span class="tag">${esc(r.m.data_state || '')}</span></td>
      </tr>`).join('');
  };

  /* ── 切替と初期表示 ── */
  const initialHash = location.hash;
  const setMode = all => {
    $('mode-dep').setAttribute('aria-selected', String(!all));
    $('mode-all').setAttribute('aria-selected', String(all));
    $('view-dep').hidden = all; $('view-all').hidden = !all;
    if (all) { renderAll(); history.replaceState(null, '', location.pathname + location.search + '#all'); }
    else selectDep(+((deps.querySelector('.dep[aria-selected="true"]') || { dataset: { i: 0 } }).dataset.i));
  };
  $('mode-dep').addEventListener('click', () => setMode(false));
  $('mode-all').addEventListener('click', () => setMode(true));
  const m0 = initialHash.match(/dep=(\d+)/);
  if (initialHash === '#all') setMode(true); else selectDep(m0 && D.departments[+m0[1]] ? +m0[1] : 0);

  $('foot').innerHTML = `数字は ${esc(D.source)} から <code>${esc(D.endpoints[0])}</code> で読んだ日次の時間外（freee が自動計算したもの）。取得 ${esc(fmtDT(D.fetched_at))}。` +
    `「未」は打刻なし（freee は所定どおり480分を立てるが、残業には積まない）。「欠」は欠勤。「退勤なし」は出勤打刻だけの日（打刻の記録で見分ける）。休日出勤の時間外は合計に含め、1日あたりには含めない。閾値の正本は freee の36協定設定で、こちらは有効開始日つきの写し。`;
})();
</script>
</body>
</html>
